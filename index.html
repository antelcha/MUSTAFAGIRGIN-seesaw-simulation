<!DOCTYPE html>
<html>
<head>
  <title>Seesaw Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="row">
            <div id="left-weight" class="box"> 
                <div class="title">LEFT WEIGHT</div>
                <div class="value">0</div>
            </div>
            <div id="next-weight" class="box"> 
                <div class="title">NEXT WEIGHT</div>
                <div class="value">0</div>
            </div>
            <div id="right-weight" class="box"> 
                <div class="title">RIGHT WEIGHT</div>
                <div class="value">0</div>
            </div>
            <div id="tilt-angle" class="box"> 
                <div class="title">TILT ANGLE</div>
                <div class="value">0.0 degree</div>
            </div>
        </div>
        
        <div class="simulation-container">
            <div class="seesaw-container">
                <div class="bar"></div>
                <div class="support"></div>
            </div>
            <div class="ground"></div>
        </div>
        <button id="reset-button">Reset</button>
        <div class="log-container"></div>
    </div> 
    
    <audio id="shoosh-sound" src="swoosh.mp3" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
